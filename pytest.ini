[pytest]
testpaths = tests
# O Python 3.9 que vem no macOS é compilado com LibreSSL e o urllib3 v2 avisa
# disso ao ser importado. É inofensivo (o HTTPS funciona); o main.py já filtra
# a mesma mensagem, e aqui fazemos o mesmo para a suíte de testes.
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL
